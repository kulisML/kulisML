<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Premium AI profile hero for kulissssss</title>
  <desc id="desc">A premium animated AI identity panel with neural mesh, signal orbit, and intelligence pipeline motifs.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05070F"/>
      <stop offset="0.48" stop-color="#0B1024"/>
      <stop offset="1" stop-color="#06151A"/>
    </linearGradient>
    <linearGradient id="edge" x1="124" y1="30" x2="1082" y2="378" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E6F7FF"/>
      <stop offset="0.24" stop-color="#67E8F9"/>
      <stop offset="0.58" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="soft" x1="130" y1="114" x2="1068" y2="302" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8F9" stop-opacity="0.78"/>
      <stop offset="0.54" stop-color="#A78BFA" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0.72"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(780 176) rotate(145) scale(506 304)">
      <stop stop-color="#67E8F9" stop-opacity="0.24"/>
      <stop offset="0.38" stop-color="#8B5CF6" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-120" y="-120" width="1440" height="660" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.40 0 0 0 0 0.91 0 0 0 0 0.98 0 0 0 0.64 0"/>
      <feBlend in="SourceGraphic" mode="screen"/>
    </filter>
    <filter id="textGlow" x="0" y="0" width="700" height="260" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#67E8F9" flood-opacity="0.35"/>
    </filter>
    <pattern id="microgrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#18243A" stroke-width="1" opacity="0.46"/>
    </pattern>
    <style>
      .signature-scan {
        animation: signature-scan 8s cubic-bezier(.42,0,.18,1) infinite;
        transform-origin: center;
      }
      .signal-orbit {
        animation: signal-orbit 16s linear infinite;
        transform-origin: 902px 204px;
      }
      .neural-node-a { animation: neural-pulse 4.6s ease-in-out infinite; }
      .neural-node-b { animation: neural-pulse 5.2s ease-in-out infinite .35s; }
      .pipeline-flow { animation: pipeline-flow 6s ease-in-out infinite; }
      .float-panel { animation: float-panel 8s ease-in-out infinite; }
      .signal-line { animation: signal-line 7s ease-in-out infinite; }
      @keyframes signature-scan {
        0%, 100% { transform: translateX(-210px); opacity: 0; }
        12% { opacity: .88; }
        48% { transform: translateX(244px); opacity: .34; }
        82% { opacity: 0; }
      }
      @keyframes signal-orbit {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes neural-pulse {
        0%, 100% { opacity: .48; transform: scale(.98); }
        50% { opacity: 1; transform: scale(1.12); }
      }
      @keyframes pipeline-flow {
        0%, 100% { stroke-dashoffset: 120; opacity: .42; }
        50% { stroke-dashoffset: 0; opacity: 1; }
      }
      @keyframes float-panel {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }
      @keyframes signal-line {
        0%, 100% { opacity: .22; }
        50% { opacity: .72; }
      }
      @media (prefers-reduced-motion: reduce) {
        .signature-scan,
        .signal-orbit,
        .neural-node-a,
        .neural-node-b,
        .pipeline-flow,
        .float-panel,
        .signal-line {
          animation: none;
        }
      }
    </style>
  </defs>

  <rect width="1200" height="420" rx="34" fill="url(#surface)"/>
  <rect width="1200" height="420" rx="34" fill="url(#microgrid)" opacity="0.5"/>
  <rect width="1200" height="420" rx="34" fill="url(#halo)"/>

  <g opacity="0.62">
    <path class="signal-line" d="M-40 314C166 268 278 318 470 236C640 162 796 118 1248 154" stroke="#67E8F9" stroke-width="1.4"/>
    <path class="signal-line" d="M-34 108C178 162 306 98 510 126C724 156 820 270 1238 232" stroke="#8B5CF6" stroke-width="1.2"/>
    <path class="signal-line" d="M72 384C254 324 414 334 590 270C758 210 900 92 1152 68" stroke="#34D399" stroke-width="1.2"/>
  </g>

  <g filter="url(#textGlow)">
    <text x="74" y="118" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="4">KULISML</text>
    <text x="74" y="188" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="64" font-weight="850" letter-spacing="0">kulissssss</text>
    <text x="78" y="236" fill="#67E8F9" font-family="JetBrains Mono, Consolas, monospace" font-size="24" font-weight="800" letter-spacing="0">AI FULL-STACK / ML ENGINEERING / PRODUCT AUTOMATION</text>
  </g>

  <text x="78" y="286" fill="#C8D5EA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="500" letter-spacing="0">Building intelligent systems with clean APIs, applied ML, and premium frontend polish.</text>

  <g transform="translate(78 326)">
    <rect width="126" height="38" rx="19" fill="#07111F" stroke="#67E8F9" stroke-opacity="0.55"/>
    <text x="23" y="25" fill="#E6F7FF" font-family="JetBrains Mono, Consolas, monospace" font-size="14" font-weight="700">PYTHON</text>
    <rect x="140" width="160" height="38" rx="19" fill="#07111F" stroke="#8B5CF6" stroke-opacity="0.55"/>
    <text x="162" y="25" fill="#EDE9FE" font-family="JetBrains Mono, Consolas, monospace" font-size="14" font-weight="700">TYPESCRIPT</text>
    <rect x="314" width="112" height="38" rx="19" fill="#07111F" stroke="#34D399" stroke-opacity="0.55"/>
    <text x="339" y="25" fill="#DCFCE7" font-family="JetBrains Mono, Consolas, monospace" font-size="14" font-weight="700">FASTAPI</text>
    <rect x="440" width="92" height="38" rx="19" fill="#07111F" stroke="#67E8F9" stroke-opacity="0.55"/>
    <text x="466" y="25" fill="#E6F7FF" font-family="JetBrains Mono, Consolas, monospace" font-size="14" font-weight="700">REACT</text>
  </g>

  <g class="signature-scan" opacity="0.75">
    <rect x="210" y="52" width="5" height="316" rx="2.5" fill="#E6F7FF"/>
    <rect x="226" y="52" width="122" height="316" fill="url(#soft)" opacity="0.12"/>
  </g>

  <g class="float-panel" transform="translate(712 74)">
    <rect width="394" height="268" rx="28" fill="#07111F" fill-opacity="0.82" stroke="url(#edge)" stroke-opacity="0.58"/>
    <rect x="26" y="26" width="342" height="58" rx="16" fill="#0C1526" stroke="#223657"/>
    <text x="48" y="61" fill="#F8FAFC" font-family="JetBrains Mono, Consolas, monospace" font-size="15" font-weight="800">Intelligence Pipeline</text>
    <circle cx="337" cy="55" r="6" fill="#34D399"/>

    <path class="pipeline-flow" d="M60 154H132C152 154 158 118 180 118H226C250 118 256 190 282 190H336" stroke="url(#soft)" stroke-width="5" stroke-linecap="round" stroke-dasharray="28 18"/>

    <g stroke="#263B5E" stroke-width="1">
      <rect x="42" y="126" width="76" height="56" rx="16" fill="#0B1324"/>
      <rect x="160" y="92" width="88" height="56" rx="16" fill="#0B1324"/>
      <rect x="282" y="162" width="72" height="56" rx="16" fill="#0B1324"/>
    </g>
    <text x="62" y="160" fill="#67E8F9" font-family="JetBrains Mono, Consolas, monospace" font-size="13" font-weight="700">DATA</text>
    <text x="186" y="126" fill="#C4B5FD" font-family="JetBrains Mono, Consolas, monospace" font-size="13" font-weight="700">MODEL</text>
    <text x="301" y="197" fill="#86EFAC" font-family="JetBrains Mono, Consolas, monospace" font-size="13" font-weight="700">SHIP</text>

    <g class="signal-orbit" opacity="0.84">
      <ellipse cx="190" cy="148" rx="158" ry="94" stroke="#67E8F9" stroke-opacity="0.22"/>
      <circle cx="348" cy="148" r="7" fill="#67E8F9"/>
    </g>
  </g>

  <g class="neural" filter="url(#glow)" stroke="url(#soft)" stroke-width="1.6">
    <path d="M524 76L608 118L560 190L652 230L704 158L608 118" opacity="0.7"/>
    <circle class="neural-node-a" cx="524" cy="76" r="5" fill="#67E8F9"/>
    <circle class="neural-node-b" cx="608" cy="118" r="7" fill="#A78BFA"/>
    <circle class="neural-node-a" cx="560" cy="190" r="6" fill="#67E8F9"/>
    <circle class="neural-node-b" cx="652" cy="230" r="5" fill="#34D399"/>
    <circle class="neural-node-a" cx="704" cy="158" r="6" fill="#A78BFA"/>
  </g>

  <rect x="1" y="1" width="1198" height="418" rx="33" stroke="url(#edge)" stroke-opacity="0.58" stroke-width="2"/>
</svg>
