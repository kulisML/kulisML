<svg width="1600" height="760" viewBox="0 0 1600 760" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Bright AI product builder hero for kulissssss</title>
  <desc id="desc">A bright animated product-style hero with colorful waves, AI assistant, workflow cards, code panel, ML chart, and database blocks.</desc>
  <defs>
    <linearGradient id="coral" x1="0" y1="0" x2="582" y2="294" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF776D"/>
      <stop offset="1" stop-color="#FF4E45"/>
    </linearGradient>
    <linearGradient id="teal" x1="154" y1="598" x2="1378" y2="416" gradientUnits="userSpaceOnUse">
      <stop stop-color="#04B7B7"/>
      <stop offset="1" stop-color="#0ED6C7"/>
    </linearGradient>
    <linearGradient id="yellow" x1="312" y1="654" x2="1518" y2="388" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFC638"/>
      <stop offset="1" stop-color="#FFAE22"/>
    </linearGradient>
    <linearGradient id="purple" x1="286" y1="752" x2="1470" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#6D4AFF"/>
    </linearGradient>
    <linearGradient id="ink" x1="82" y1="210" x2="686" y2="370" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07152F"/>
      <stop offset="1" stop-color="#101A3A"/>
    </linearGradient>
    <linearGradient id="glass" x1="774" y1="150" x2="1356" y2="590" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF7FF"/>
    </linearGradient>
    <filter id="cardShadow" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#1B2958" flood-opacity="0.18"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1B2958" flood-opacity="0.08"/>
    </filter>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#172554" flood-opacity="0.16"/>
    </filter>
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="3" fill="#0EA5A6" opacity="0.25"/>
    </pattern>
    <style>
      .wave-coral { animation: wave-coral 9s ease-in-out infinite; transform-origin: 320px 620px; }
      .wave-yellow { animation: wave-yellow 8.5s ease-in-out infinite; transform-origin: 720px 610px; }
      .wave-teal { animation: wave-teal 10s ease-in-out infinite; transform-origin: 940px 625px; }
      .wave-purple { animation: wave-purple 11s ease-in-out infinite; transform-origin: 970px 690px; }
      .float-bot { animation: float-bot 5.8s ease-in-out infinite; }
      .flow-card { animation: flow-card 5s ease-in-out infinite; }
      .flow-card:nth-of-type(2) { animation-delay: .45s; }
      .flow-card:nth-of-type(3) { animation-delay: .9s; }
      .ml-chart { animation: ml-chart 4.8s ease-in-out infinite; }
      .code-line { animation: code-line 3.8s ease-in-out infinite; }
      .code-line:nth-child(2n) { animation-delay: .35s; }
      .code-line:nth-child(3n) { animation-delay: .7s; }
      .node { animation: node 3.7s ease-in-out infinite; }
      .node:nth-child(2n) { animation-delay: .4s; }
      .node:nth-child(3n) { animation-delay: .8s; }
      .spark { animation: spark 4.2s ease-in-out infinite; }
      .play { animation: play 2.8s ease-in-out infinite; transform-origin: center; }
      .database { animation: database 5.2s ease-in-out infinite; }
      @keyframes wave-coral {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-18px) rotate(-1.2deg); }
      }
      @keyframes wave-yellow {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-13px) rotate(1deg); }
      }
      @keyframes wave-teal {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(15px) rotate(-.8deg); }
      }
      @keyframes wave-purple {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
      @keyframes float-bot {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-16px); }
      }
      @keyframes flow-card {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-10px) scale(1.02); }
      }
      @keyframes ml-chart {
        0%, 100% { stroke-dashoffset: 120; opacity: .65; }
        50% { stroke-dashoffset: 0; opacity: 1; }
      }
      @keyframes code-line {
        0%, 100% { opacity: .48; transform: translateX(0); }
        50% { opacity: 1; transform: translateX(16px); }
      }
      @keyframes node {
        0%, 100% { transform: scale(1); opacity: .76; }
        50% { transform: scale(1.22); opacity: 1; }
      }
      @keyframes spark {
        0%, 100% { opacity: .28; transform: translateY(0); }
        50% { opacity: 1; transform: translateY(-8px); }
      }
      @keyframes play {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.12); }
      }
      @keyframes database {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .wave-coral,
        .wave-yellow,
        .wave-teal,
        .wave-purple,
        .float-bot,
        .flow-card,
        .ml-chart,
        .code-line,
        .node,
        .spark,
        .play,
        .database {
          animation: none;
        }
      }
    </style>
  </defs>

